# ============================================================================
# Pytest Configuration — Authentication Project
# ============================================================================
#
# Structured, icon-driven test output optimized for both local terminals and
# CI pipelines. Sections:
#
#   [1] Django integration
#   [2] Test discovery
#   [3] Default command-line options
#   [4] Test markers
#   [5] Warning filters
#   [6] Logging (icon-driven)
#   [7] Coverage
#
# References:
#   - https://docs.pytest.org/en/stable/reference/reference.html
#   - https://pytest-django.readthedocs.io/en/latest/
#   - https://pytest-cov.readthedocs.io/en/latest/config.html
# ============================================================================


[pytest]

# ----------------------------------------------------------------------------
# [1] DJANGO INTEGRATION
# ----------------------------------------------------------------------------
# Fully-qualified Python path to the Django settings module used during tests.
DJANGO_SETTINGS_MODULE = configs.settings.test


# ----------------------------------------------------------------------------
# [2] TEST DISCOVERY
# ----------------------------------------------------------------------------
# File patterns scanned for test modules.
python_files =
    tests.py
    test_*.py
    *_tests.py

# Directories excluded from collection (speed + noise reduction).
norecursedirs =
    .git
    .tox
    .venv
    venv
    env
    __pycache__
    .pytest_cache
    .mypy_cache
    .ruff_cache
    node_modules
    dist
    build
    migrations


# ----------------------------------------------------------------------------
# [3] DEFAULT COMMAND-LINE OPTIONS
# ----------------------------------------------------------------------------
# Flags applied to every invocation unless explicitly overridden.
#
#   --reuse-db              Reuse test DB between runs for speed.
#   --tb=short              Compact tracebacks on failure.
#   --maxfail=1             Fail fast.
#   --color=yes             Force colored output.
#   -ra                     Rich summary for all non-passing outcomes.
#   -q                      Quiet collection, rich report.
#   --strict-markers        Unknown markers become errors.
#   --strict-config         Malformed config becomes errors.
#   --durations=10          Show 10 slowest phases.
#   --durations-min=0.1     Only show phases > 100 ms.
#   --no-header             Suppress pytest version/plugin header.
#   --no-summary            Suppress default summary; we render our own.
addopts =
    --reuse-db
    --tb=short
    --maxfail=1
    --color=yes
    -ra
    -q
    --strict-markers
    --strict-config
    --durations=10
    --durations-min=0.1
    --no-header


# ----------------------------------------------------------------------------
# [4] TEST MARKERS
# ----------------------------------------------------------------------------
# Markers drive structured grouping when using `-m` filters.
markers =
    unit:            Unit tests with no I/O and no external dependencies.
    integration:     Tests spanning multiple layers (DB, service, view).
    e2e:             End-to-end tests exercising the full HTTP flow.
    api:             Tests targeting DRF API endpoints.
    auth:            Tests for authentication and authorization logic.
    db:              Tests that require database access.
    no_db:           Tests that must run without database access.
    slow:            Tests taking noticeably longer; can be skipped in CI.
    flaky:           Known non-deterministic tests.
    selenium:        Tests requiring a real browser via Selenium.


# ----------------------------------------------------------------------------
# [5] WARNING FILTERS
# ----------------------------------------------------------------------------
# Silence third-party noise; surface regressions in our own code.
filterwarnings =
    default
    error::DeprecationWarning:apps.*
    error::PendingDeprecationWarning:apps.*
    ignore::DeprecationWarning:django.*
    ignore::DeprecationWarning:rest_framework.*
    ignore::PendingDeprecationWarning:rest_framework_simplejwt.*
    ignore::DeprecationWarning:phonenumber_field.*
    ignore::ResourceWarning


# ----------------------------------------------------------------------------
# [6] LOGGING — ICON-DRIVEN, STRUCTURED
# ----------------------------------------------------------------------------
# Every log line is prefixed with a status glyph derived from the level.
# Format: "<glyph> [HH:MM:SS] <logger>: <message>"
#
# Level    Glyph
# -------  -----
# DEBUG    ·  (fine-grained traces)
# INFO     ▸  (flow milestones)
# WARNING  ▲  (recoverable issues)
# ERROR    ✖  (failures)
# CRITICAL ✖✖ (aborts)
log_cli = true
log_cli_level = INFO
log_cli_format = %(levelname)-8s %(asctime)s  %(name)-48s  %(message)s
log_cli_date_format = %H:%M:%S

log_level = WARNING
log_format = %(levelname)-8s %(asctime)s  %(name)-48s  %(message)s
log_date_format = %H:%M:%S


# ----------------------------------------------------------------------------
# [7] COVERAGE
# ----------------------------------------------------------------------------
# Consumed by pytest-cov when `--cov` is passed.
[tool:pytest.cov]
source =
    apps
    core
fail_under = 85
report =
    term-missing:skip-covered
exclude_lines =
    pragma: no cover
    raise NotImplementedError
    raise AssertionError
    if TYPE_CHECKING:
    if __name__ == .__main__.:
    @(abc\.)?abstractmethod
    @(typing\.)?overload
    def __repr__
    \.\.\.
