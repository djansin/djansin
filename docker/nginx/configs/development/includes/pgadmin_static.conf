# -------------------------------------------
# Serve pgAdmin static assets with long-term caching
# pgAdmin static files are fingerprinted → safe to cache
# -------------------------------------------
location /static/ {
    proxy_pass http://pgadmin:80;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Some pgAdmin assets live in /misc (logos, icons, etc.)
location /misc/ {
    proxy_pass http://pgadmin:80;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
