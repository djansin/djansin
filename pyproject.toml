# ============================================================================
# pyproject.toml - Project Configuration
# This file follows PEP 518/517 and contains project metadata
# ============================================================================

[build-system]
# Build system requirements (PEP 517/518)
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Basic project metadata
name = "djansin"
version = "0.1.0"
description = "A flexible, composable system for developing Django applications"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Mohammad Ali Amini", email = "hakhsin@gmail.com"},
]
maintainers = [
    {name = "Mohammad Ali Amini", email = "hakhsin@gmail.com"},
]

# Project URLs (PyPI, docs, etc.)
[project.urls]
Homepage = "https://gitlab.com/amoosin/djansin"
Documentation = "https://gitlab.com/amoosin/djansin/"
Repository = "https://gitlab.com/amoosin/djansin"
Issues = "https://gitlab.com/amoosin/djansin/issues"
Changelog = "https://gitlab.com/amoosin/djansin/releases"

# Dependencies
dependencies = [
    "Django>=5.2,<6.0",
    "typing-extensions>=4.0.0",
]

# Optional dependencies (extras)
[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",          # Linter and formatter
    "pytest>=7.0.0",        # Testing framework
    "pytest-django>=4.5.0", # Django integration for pytest
    "pytest-cov>=4.0.0",    # Coverage reporting
    "factory-boy>=3.0.0",   # Test data factories
    "freezegun>=1.0.0",     # Time freezing for tests
    "ipdb>=0.13.0",         # Debugger
    "ipython>=8.0.0",       # Enhanced Python shell
]
test = [
    "pytest>=7.0.0",
    "pytest-django>=4.5.0",
    "pytest-cov>=4.0.0",
    "factory-boy>=3.0.0",
    "freezegun>=1.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
]
lint = [
    "ruff>=0.1.0",
]
type = [
    "mypy>=1.0.0",
    "django-stubs>=1.16.0",
    "types-requests>=2.0.0",
]

# Entry points (console scripts)
[project.scripts]
djansin = "djansin.cli:main"
