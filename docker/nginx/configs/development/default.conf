# -------------------------------------------
# Map for WebSocket upgrade
# -------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# -------------------------------------------
# Django API Server
# -------------------------------------------
server {
    # Allow large upload sizes (useful during development)
    client_max_body_size 20M;

    # Listen on port 80 inside the container
    listen 80;

    # Development hostname for Django API
    server_name localhost;

    # -------------------------------------------
    # Global gzip settings
    # -------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript text/javascript application/json;

    # -------------------------------------------
    # Security headers (basic)
    # -------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # -------------------------------
    # Django server proxy
    # -------------------------------
    location / {
        # Forward incoming traffic to Django's internal port
        proxy_pass http://api:8000;

        # Preserve original client IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Preserve host header
        proxy_set_header Host $http_host;

        # Disable redirect rewriting
        proxy_redirect off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeout settings
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;

        # Handle preflight OPTIONS requests
        if ($request_method = 'OPTIONS') {
            add_header Content-Type 'text/plain charset=UTF-8';
            add_header Content-Length 0;
            return 204;
        }
    }

    # Include static/media configs for Django
    include /etc/nginx/conf.d/includes/django_static.conf;
    include /etc/nginx/conf.d/includes/django_media.conf;
}

# -------------------------------------------
# pgAdmin Server
# -------------------------------------------
server {
    # Allow larger uploads (pgAdmin sometimes sends sizable requests)
    client_max_body_size 20M;

    # Listen on port 80 inside the container
    listen 80;

    # Development hostname for pgAdmin
    server_name pg.localhost;

    # -------------------------------------------
    # Global gzip for assets (pgAdmin has big JS/CSS bundles)
    # -------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript text/javascript application/json;

    # -------------------------------------------
    # Security headers (safe even in development)
    # -------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # -------------------------------
    # pgAdmin proxy
    # -------------------------------
    location / {
        # Forward all requests to pgAdmin container
        proxy_pass http://pgadmin:80;

        # Preserve client IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Preserve original host header
        proxy_set_header Host $host;

        # Do not rewrite redirects
        proxy_redirect off;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Increase timeouts (pgAdmin has heavy internal API calls)
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    # Include static assets for pgAdmin
    # include /etc/nginx/conf.d/includes/pgadmin_static.conf;
}

# -------------------------------------------
# Global MIME types
# -------------------------------------------
types {
    application/javascript js;
    text/css css;
    application/json json;
    application/font-woff woff;
    application/font-woff2 woff2;
    application/vnd.ms-fontobject eot;
    font/ttf ttf;
    font/otf otf;
    text/html html htm shtml;
    text/xml xml;
    image/svg+xml svg svgz;
    image/webp webp;
    image/png png;
    image/jpeg jpeg jpg;
    application/wasm wasm;
}
