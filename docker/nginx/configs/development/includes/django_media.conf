# =============================================================================
# NGINX CONFIGURATION - MEDIA FILES HANDLING
# =============================================================================
# Description: Serves user-uploaded media files directly from the filesystem
#              with appropriate caching headers for development environments.
# =============================================================================

# -----------------------------------------------------------------------------
# Location Block: /media/
# -----------------------------------------------------------------------------
# Serves user-uploaded media files (images, documents, etc.) directly from
# the filesystem without passing requests to the application server.
#
# Why direct serving?
#   - Media files are static and don't require processing by Django/Python
#   - Direct serving is significantly faster and reduces application load
#   - Nginx is highly optimized for static file serving
#
# When to use:
#   - Development environments (where media files change frequently)
#   - Production with proper authentication requirements (use X-Accel-Redirect)
#   - Local testing and debugging
# -----------------------------------------------------------------------------
location /media/ {
    # -------------------------------------------------------------------------
    # Filesystem Path Mapping
    # -------------------------------------------------------------------------
    # Maps the /media/ URL path to the physical filesystem location.
    # All user-uploaded files should be stored in this directory.
    # Ensure the directory exists and is readable by the nginx worker process.
    alias /assets/media/;

    # -------------------------------------------------------------------------
    # Development-Specific Caching Headers
    # -------------------------------------------------------------------------
    # These headers disable caching entirely - ideal for development where
    # media files change frequently and immediate visibility is needed.
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires 0;
}