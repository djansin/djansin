# =============================================================================
# NGINX CONFIGURATION - PGADMIN STATIC ASSETS
# =============================================================================
# Description: Serves pgAdmin static assets with aggressive caching for
#              optimal performance. Since pgAdmin uses fingerprinting for
#              static files, they can be cached indefinitely.
# =============================================================================

# -----------------------------------------------------------------------------
# Location Block: /static/
# -----------------------------------------------------------------------------
# Serves pgAdmin's static assets (CSS, JavaScript, fonts, etc.) with
# long-term caching enabled.
#
# Why long-term caching is safe:
#   - pgAdmin uses filename fingerprinting (e.g., app.abc123.css)
#   - When files change, their fingerprints change, creating new URLs
#   - Old cached versions are never requested again
#   - No risk of serving stale assets to users
#
# Performance benefits:
#   - Reduces server load by eliminating repeated requests
#   - Improves page load time for returning visitors
#   - Minimizes bandwidth usage
#   - Compatible with CDN integration
#
# Cache duration: 1 year (31536000 seconds)
#   - Maximum cache duration allowed by browsers and CDNs
#   - Immutable flag instructs browsers never to revalidate
#   - Perfect for fingerprinted assets
# -----------------------------------------------------------------------------
location /static/ {
    # -------------------------------------------------------------------------
    # Proxy Configuration
    # -------------------------------------------------------------------------
    # Forward requests to the pgAdmin container/service on port 80.
    # Assumes you have a 'pgadmin' upstream defined or container resolvable.
    # Typical upstream configuration:
    #   upstream pgadmin {
    #       server pgadmin:80;
    #   }
    proxy_pass http://pgadmin:80;

    # -------------------------------------------------------------------------
    # Header Manipulation for Caching
    # -------------------------------------------------------------------------
    # Strip Accept-Encoding header to prevent compression conflicts.
    # This ensures consistent asset delivery and prevents issues with
    # pre-compressed assets that might be served incorrectly.
    proxy_set_header Accept-Encoding "";

    # -------------------------------------------------------------------------
    # Long-Term Caching Headers
    # -------------------------------------------------------------------------
    # Cache duration: 1 year (60 × 60 × 24 × 365 = 31536000)
    # 'public' - Allows caching by browsers and intermediate proxies/CDNs
    # 'max-age=31536000' - Cache for 1 year without revalidation
    # 'immutable' - File will never change during the cache period
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# -----------------------------------------------------------------------------
# Location Block: /misc/
# -----------------------------------------------------------------------------
# Serves pgAdmin miscellaneous assets (logos, icons, images, etc.) that
# are also fingerprinted or versioned, enabling safe long-term caching.
#
# These assets typically include:
#   - pgAdmin logos
#   - UI icons
#   - Branding images
#   - Favicon and related files
#
# Cache settings apply same as /static/ for consistency and maximum performance.
# -----------------------------------------------------------------------------
location /misc/ {
    # -------------------------------------------------------------------------
    # Proxy Configuration
    # -------------------------------------------------------------------------
    # Forward requests to the pgAdmin container/service
    proxy_pass http://pgadmin:80;

    # -------------------------------------------------------------------------
    # Header Manipulation
    # -------------------------------------------------------------------------
    # Prevent compression-related issues
    proxy_set_header Accept-Encoding "";

    # -------------------------------------------------------------------------
    # Long-Term Caching Headers
    # -------------------------------------------------------------------------
    # Same caching strategy as /static/ for consistency
    # 1-year cache with immutable flag for fingerprinted assets
    add_header Cache-Control "public, max-age=31536000, immutable";
}
