services:
  # Runs the Nginx reverse proxy server that forwards incoming HTTP requests
  # to the Django application container.
  web:
    build:
      context: ./docker/nginx           # Build context for the Nginx image.
      dockerfile: Dockerfile            # Dockerfile used to build the image.
      target: development-run-stage     # Build stage optimized for development.
    container_name: djansin_web         # Name assigned to the Nginx container.
    env_file:
      - ./envs/.env.nginx               # Environment variables loaded for Nginx.
    depends_on:
      - api                             # Ensures the API service starts before Nginx.
    volumes:
      - .:/app:z                        # Mounts the project directory into the container.
      - ./docker/nginx/configs/development/:/etc/nginx/conf.d/  # Nginx config files.
      - api_staticfiles:${STATIC_ROOT}  # Provides access to Django collected static files.
      - api_mediafiles:${MEDIA_ROOT}    # Provides access to uploaded media files.
    networks:
      - dsnet                           # Connects the container to the shared network.
    ports:
      - "${SERVER_PORT}:80"             # Maps host port ${SERVER_PORT} to container port 80.

  # Runs the Django application server (development mode),
  # including app code, custom commands, and static/media file handling.
  api:
    build:
      context: .                          # Project root as build context.
      dockerfile: ./docker/django/Dockerfile  # Dockerfile for Django.
      target: development-run-stage       # Development build stage for Django.
      args:
        - BUILD_ENVIRONMENT=development   # Build argument passed to Dockerfile.
        - WORK_DIRECTORY=/app             # Working directory inside the container.
    container_name: djansin_api           # Name assigned to the Django container.
    environment:
      - PROJECT_NAME=${PROJECT_NAME}      # Name of the Django project.
      - STATIC_ROOT=${STATIC_ROOT}        # Path where Django stores collected static files.
      - MEDIA_ROOT=/assets/${MEDIA_ROOT}  # Path where Django stores media uploads.
      - APPS_DIRECTORY=${APPS_DIRECTORY}  # Folder where Django apps are located.
      - PYTHONUSERBASE=/packages          # User-level Python package directory.
      - USERNAME=${USERNAME}              # Default username used for internal scripts.
    env_file:
      - ./envs/.env.api                   # Loads environment variables for the Django app.
    command: "yarsin runserver"           # Command to start Django’s development server.
    depends_on:
      - db                                # Ensures database is ready before Django starts.
    volumes:
      - .:/app:z                          # Mounts application source code.
      - ./docker/django/scripts/sources/:/usr/local/bin/sources/:z  # Custom scripts for Django.
      - api_staticfiles:${STATIC_ROOT}    # Shared static files volume.
      - api_mediafiles:${MEDIA_ROOT}      # Shared media files volume.
      - api_packages:/packages/           # Stores installed Python packages persistently.
    networks:
      - dsnet                             # Connects the container to the shared network.
    expose:
      - "8000"                            # Makes port 8000 available to linked containers.

  # Runs pgAdmin, a web dashboard used for managing PostgreSQL databases.
  pgadmin:
    image: dpage/pgadmin4                 # Official pgAdmin image.
    container_name: djansin_pgadmin       # Name for the pgAdmin container.
    env_file:
      - ./envs/.env.pgadmin               # Environment variables for pgAdmin.
    depends_on:
      - db                                # Ensures pgAdmin starts after the database.
    volumes:
      - pgadmin_data:/var/lib/pgadmin/    # Stores pgAdmin metadata persistently.
    networks:
      - dsnet                             # Connects pgAdmin to the shared network.

  # Runs the PostgreSQL database server used by Django and pgAdmin.
  db:
    build:
      context: ./docker/postgres          # Build context for PostgreSQL.
      dockerfile: Dockerfile              # Dockerfile for PostgreSQL image.
      target: development-run-stage       # Development stage of the Postgres image.
    container_name: djansin_db            # Name for the PostgreSQL container.
    environment:
      - USERNAME=${USERNAME}              # Default username used for internal scripts.
    env_file:
      - ./envs/.env.db                    # Environment variables (user, password, database).
    volumes:
      - ./docker/postgres/initdb/:/docker-entrypoint-initdb.d/ # SQL scripts run on first startup.
      - ./backups/:/backups/              # Host directory for database backups.
      - db_data:/var/lib/postgresql/data/ # Persistent database storage.
    networks:
      - dsnet                             # Connects the database to the shared network.

networks:
  dsnet:
    driver: bridge                        # Defines a bridge network for container communication.

volumes:
  db_data: {}                             # Persistent storage for PostgreSQL data.
  api_staticfiles: {}                     # Stores Django collected static files.
  api_mediafiles: {}                      # Stores uploaded media files.
  api_packages: {}                        # Stores installed Python packages for persistence.
  pgadmin_data: {}                        # Stores pgAdmin metadata.
