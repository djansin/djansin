# ==============================================================================
# STATIC FILES RESOLUTION CONFIGURATION
# ==============================================================================
# Handles static file serving for Django applications with intelligent
# fallback resolution between global and app-specific static directories.
# ==============================================================================

# ------------------------------------------------------------------------------
# Primary Static File Resolution
# ------------------------------------------------------------------------------
# Handles ALL static file requests with the pattern: /static/<path>
#
# RESOLUTION LOGIC:
# 1. FIRST: Attempt to serve as a GLOBAL static file
#    Path: /app/static/<entire_request_path>
#    Example: /static/js/main.js → /app/static/js/main.js
#
# 2. IF NOT FOUND: Interpret as APP-SPECIFIC static file
#    Pattern: /static/<app_name>/<file_path_relative_to_app_static>
#    Search Order:
#    a) /app/apps/<app_name>/static/<file_path>
#    b) /app/djansin/<app_name>/static/<file_path>
#
# 3. FINAL FALLBACK: Django collected static files (@fallback_static)
#
# EXAMPLE REQUESTS & RESOLUTION:
# Request: /static/js/kateba.js
#   → /app/static/js/kateba.js (global static)
#
# Request: /static/katebal/js/kateba.js
#   → /app/static/katebal/js/kateba.js (global, if exists)
#   → ELSE: /app/apps/katebal/static/js/kateba.js (app-specific)
#   → ELSE: /app/djansin/katebal/static/js/kateba.js (alternative app location)
#   → ELSE: Collected static fallback
# ------------------------------------------------------------------------------
location ~ ^/static/([^/]+)/(.+)$ {
    # Base directory for file resolution
    root /app;

    # Development cache control - ensure fresh files during active development
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires 0 always;

    # Diagnostic header: shows current app-specific search path
    add_header X-Static-Search-Path "/apps/$1/static/$2" always;

    # Resolution chain (in order of priority):
    # 1. Global static file: /app/static/<app_name>/<file_path>
    # 2. App-specific in /apps/: /app/apps/<app_name>/static/<file_path>
    # 3. App-specific in /djansin/: /app/djansin/<app_name>/static/<file_path>
    # 4. Collected static files fallback
    try_files $uri /apps/$1/static/$2 /djansin/$1/static/$2 @fallback_static;
}

# ------------------------------------------------------------------------------
# Collected Static Files Fallback
# ------------------------------------------------------------------------------
# Final fallback location for static files collected by Django's
# `collectstatic` command. Only invoked when files are not found in
# any developer-editable source locations.
# ------------------------------------------------------------------------------
location @fallback_static {
    # Remove '/static/' prefix to match collected files structure
    # Example: /static/core/js/app.js → /core/js/app.js
    rewrite ^/static/(.*)$ /$1 break;

    # Root directory for Django-collected static assets
    # Shared volume between Django and Nginx containers
    root /assets/static;

    # Diagnostic header: shows fallback file path being attempted
    add_header X-Fallback-Path "/assets/static/$1" always;

    # Final attempt: serve file or return 404
    try_files $uri =404;
}
